apiVersion: apps/v1
kind: Deployment

metadata:
  name: mysql
  namespace: flask-app

spec:
  replicas: 1

  selector:
    matchLabels:
      component: mysql

  template:
    metadata:
      labels:
        component: mysql

    spec:
      containers:
        - name: mysql
          image: mysql:8.4

          ports:
            - containerPort: 3306

          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: flask-secret
                  key: MYSQL_ROOT_PASSWORD

            - name: MYSQL_DATABASE
              value: portfolio

          volumeMounts:
            - name: mysql-storage
              mountPath: /var/lib/mysql

      volumes:
        - name: mysql-storage
          emptyDir: {}

---
apiVersion: v1
kind: Service

metadata:
  name: mysql
  namespace: flask-app

spec:
  selector:
    component: mysql

  ports:
    - port: 3306
      targetPort: 3306