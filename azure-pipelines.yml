trigger:
- main

variables:
  dockerRegistryServiceConnection: 'dockerhub-connection'
  azureSubscriptionConnection: 'aks-connection'
  imageRepository: 'priyadocker2025/flask-portfolio'
  dockerfilePath: '$(Build.SourcesDirectory)/Dockerfile'
  tag: '$(Build.BuildId)'
  imagePullSecret: 'dockerhub-secret'
  namespace: 'flask-app'
  resourceGroup: 'rg-flask-aks'
  aksCluster: 'flask-aks-cluster'

stages:

- stage: Build
  displayName: Build and Push

  jobs:
  - job: Build
    pool:
      vmImage: 'ubuntu-latest'

    steps:
    - task: Docker@2
      displayName: Build and push Docker image
      inputs:
        command: 'buildAndPush'
        repository: '$(imageRepository)'
        dockerfile: '$(dockerfilePath)'
        containerRegistry: '$(dockerRegistryServiceConnection)'
        tags: |
          $(tag)

- stage: Deploy
  displayName: Deploy to AKS
  dependsOn: Build
  condition: succeeded()

  jobs:
  - job: Deploy
    pool:
      vmImage: 'ubuntu-latest'

    steps:
    - task: KubernetesManifest@1
      displayName: Create Docker Hub pull secret
      inputs:
        action: 'createSecret'
        connectionType: 'azureResourceManager'
        azureSubscriptionConnection: '$(azureSubscriptionConnection)'
        azureResourceGroup: '$(resourceGroup)'
        kubernetesCluster: '$(aksCluster)'
        namespace: '$(namespace)'
        secretType: 'dockerRegistry'
        secretName: '$(imagePullSecret)'
        dockerRegistryEndpoint: '$(dockerRegistryServiceConnection)'

    - task: KubernetesManifest@1
      displayName: Deploy to AKS
      inputs:
        action: 'deploy'
        connectionType: 'azureResourceManager'
        azureSubscriptionConnection: '$(azureSubscriptionConnection)'
        azureResourceGroup: '$(resourceGroup)'
        kubernetesCluster: '$(aksCluster)'
        namespace: '$(namespace)'
        manifests: |
          $(Build.SourcesDirectory)/mysql.yaml
          $(Build.SourcesDirectory)/deployment.yaml
          $(Build.SourcesDirectory)/service.yaml
        containers: |
          $(imageRepository):$(tag)
        imagePullSecrets: |
          $(imagePullSecret)